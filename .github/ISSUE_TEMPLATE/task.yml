name: Work item
description: A change to implement, with a stated completion bar.
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        A work item without acceptance criteria has no definition of done, so
        any pull request can claim to close it. State the bar up front.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the change.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: The user-visible or operator-visible problem this solves.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Observable conditions that must hold when this is done, and the test
        that proves each one. If an operator must accept the result before it
        merges, say so here.
      placeholder: |
        - [ ]
        - [ ] Proven by test:
        - [ ] Operator acceptance required before merge: yes / no - if yes, what
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this item deliberately does not cover.
    validations:
      required: false

[package]
name = "okp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
live-mpv = ["dep:okp-mpv"]

[dependencies]
okp-core = { path = "../okp-core" }
okp-mpv = { path = "../okp-mpv", optional = true }

[build-dependencies]
cbindgen = "0.29"

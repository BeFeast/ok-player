name: Windows Installer

# The shipping Windows artifact is the Velopack Setup.exe produced by
# installer/build-velopack.ps1. Until this workflow existed, nothing in CI ran
# that script: the release lane was a manual local operation, and
# release-windows-candidate.yml only packs the separate `win-candidate` channel
# after a merge. This lane builds the real `win` installer, installs it, asserts
# the installed tree is complete, and starts the installed application.
#
# This workflow is NOT in main's required status checks (those are "Unit tests
# (engine-agnostic Core, headless)", "Rust workspace (Linux)" and "Integration
# tests (real libmpv + render-thread guard)"). It reports on pull requests but
# cannot block a merge on its own; making it blocking is a branch-protection
# change only an operator can make. The regression tests for the assertion this
# lane runs live in scripts/tests/windows-installed-tree.Tests.ps1.
#
# Path-gated on purpose, on pull requests AND on pushes to main: a full
# self-contained WinUI publish plus a Velopack pack is expensive, and the lane
# has a known intermittent shutdown failure (#642). An advisory lane that goes
# red on unrelated pushes trains everyone to ignore it, so it only runs for
# changes that can plausibly break the installer. The two path lists below are
# duplicated rather than shared because GitHub Actions does not support YAML
# anchors; keep them identical.

on:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'installer/**'
      - 'src/OkPlayer.App/**'
      - 'src/OkPlayer.Core/**'
      - 'OkPlayer.sln'
      # Central build and package version pinning (WindowsAppSDK, Velopack):
      # a change here changes what the installer contains.
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/fetch-natives.ps1'
      - 'scripts/assert-windows-installed-tree.ps1'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/windows-package.yml'
      - 'installer/**'
      - 'src/OkPlayer.App/**'
      - 'src/OkPlayer.Core/**'
      - 'OkPlayer.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/fetch-natives.ps1'
      - 'scripts/assert-windows-installed-tree.ps1'
  workflow_dispatch:

jobs:
  windows-installer:
    name: Build, install, and launch the Velopack installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-natives.ps1

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # A CI-only version keeps this lane from ever colliding with a real tag.
      - name: Build the Velopack installer
        shell: pwsh
        run: ./installer/build-velopack.ps1 -Version "0.0.1-ci.${{ github.run_number }}"

      - name: Assert the shipping installer artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = Join-Path $PWD 'artifacts\releases'
          foreach ($name in @('OkPlayer-win-Setup.exe', 'releases.win.json')) {
            $path = Join-Path $releases $name
            if (-not (Test-Path $path)) { throw "Velopack pack did not produce $name" }
            Write-Host "$name : $((Get-Item $path).Length) bytes"
          }

      - name: Install the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'artifacts\releases\OkPlayer-win-Setup.exe'
          $proc = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Setup.exe exited with $($proc.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'OkPlayer\current\OkPlayer.exe'
          if (-not (Test-Path $installed)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'OkPlayer') -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "Installed executable not found at $installed"
          }
          Write-Host "Installed: $installed"

      # A window on screen does not prove the app shipped complete: libmpv-2.dll
      # and ffmpeg.exe are both bundled through Condition="Exists(...)" Content
      # items, and the ffmpeg fetch is best-effort, so an installer with no
      # engine and no ffmpeg installs and starts just fine.
      - name: Assert the installed tree is complete
        shell: pwsh
        run: |
          ./scripts/assert-windows-installed-tree.ps1 `
            -InstallRoot (Join-Path $env:LOCALAPPDATA 'OkPlayer\current')

      # The point of this lane: start the executable the installer actually put
      # on the machine and require a real top-level window that is the player's
      # own window, then require it to shut down on request. No leg here may pass
      # by being skipped - every branch either asserts or throws.
      - name: Launch the installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedTitle = 'OK Player'
          $installed = Join-Path $env:LOCALAPPDATA 'OkPlayer\current\OkPlayer.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'okplayer-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'okplayer-stderr.log'
          $proc = Start-Process -FilePath $installed -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(90)
          $handle = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
              if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
              throw "The installed application exited with $($proc.ExitCode) before showing a window"
            }
            $proc.Refresh()
            if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
              $handle = $proc.MainWindowHandle
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if ($handle -eq [IntPtr]::Zero) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw 'The installed application never created a top-level window'
          }
          Write-Host "Main window handle: $handle - title: $($proc.MainWindowTitle)"
          # A window handle appears before WinUI has finished starting up, so
          # closing on the handle alone tests shutdown-during-startup rather
          # than shutdown of a running app - and this lane has an intermittent
          # 0xC000027B on exit. WaitForInputIdle is a readiness condition, not a
          # settle delay: it returns when the process has drained its startup
          # work and is waiting for input. Deliberately not a sleep, which would
          # only stop CI from noticing. If it times out, that is a real failure -
          # an app that never becomes input-ready in 60s is broken. Note what this
          # costs: closing during startup is no longer exercised here, so if the
          # 0xC000027B stops appearing that failure mode moves entirely to #642
          # rather than being fixed.
          if (-not $proc.WaitForInputIdle(60000)) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw 'The installed application showed a window but never became ready for input'
          }
          Write-Host 'The installed application is idle and ready for input'
          # An error dialog, a crash reporter, or a fallback shell also produces
          # a top-level window. Require the player's own window identity.
          if ($proc.MainWindowTitle -ne $expectedTitle) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw "Expected the main window title '$expectedTitle', got '$($proc.MainWindowTitle)'"
          }
          if (-not $proc.CloseMainWindow()) { throw 'The installed application refused a close request' }
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw 'The installed application did not exit within 30s of a close request'
          }
          Write-Host "Exit code after close: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            # This is the one failure path that used to throw without showing
            # anything the app had said, which made an intermittent shutdown
            # crash undiagnosable from the run log alone. A -1073741189
            # (0xC000027B, STATUS_STOWED_EXCEPTION) here is the known open
            # shutdown defect tracked in #642; this step deliberately still
            # fails on it rather than tolerating it.
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            throw "The installed application exited with $($proc.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ok-player-windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/releases/**
            ${{ runner.temp }}/okplayer-*.log
          if-no-files-found: warn

name: Fedora RPM

# This workflow is NOT in main's required status checks (those are "Unit tests
# (engine-agnostic Core, headless)", "Rust workspace (Linux)" and "Integration
# tests (real libmpv + render-thread guard)"). It reports on pull requests but
# cannot block a merge on its own; making it blocking is a branch-protection
# change only an operator can make.

on:
  pull_request:
    paths:
      - '.copr/**'
      - '.github/workflows/rpm.yml'
      - 'rust/**'
      - 'scripts/package-linux-rpm-source.sh'
      # Shared with the .deb lane: the RPM version string is derived here, so a
      # change to it must be proved against a real SRPM build before it merges.
      - 'scripts/linux-package-version.sh'
      - 'scripts/run-linux-rpm-checks.sh'
      - 'scripts/smoke-linux-rpm-install-upgrade.sh'
      # The installed-RPM launch job runs these, so a change to any of them must
      # be exercised by this lane before it merges.
      - 'scripts/smoke-linux-rpm-installed-launch.sh'
      - 'scripts/smoke-linux-main-window.sh'
      - 'scripts/assert-linux-idle-osc-absent.sh'
      - 'scripts/run-linux-isolated-dbus-session.sh'
      - 'scripts/run-linux-isolated-xvfb-session.sh'
      - 'scripts/run-linux-child-subreaper.py'
      - 'scripts/ok-player-scratch.sh'
      - 'THIRD-PARTY-NOTICES.md'
      - 'LICENSE'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rpm:
    name: Fedora ${{ matrix.fedora }} SRPM/RPM
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    env:
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '10'
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      - name: Disable nonessential repositories before checkout
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager setopt fedora-cisco-openh264.enabled=0
          dnf install -y git

      - uses: actions/checkout@v4

      - name: Establish Git source identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" status --short
          git -C "$GITHUB_WORKSPACE" log -1 --oneline

      - name: Install Fedora build tooling
        run: |
          dnf install -y \
            cargo rust gcc gcc-c++ make findutils diffutils which \
            rpm-build rpmdevtools rpmlint zstd gzip tar \
            pkgconf-pkg-config gtk4-devel mpv-devel libX11-devel \
            wayland-devel wayland-protocols-devel mesa-libEGL-devel mesa-libGL-devel \
            desktop-file-utils appstream xdg-utils

      - name: Build, lint, install, upgrade, and remove
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
          CC: /usr/bin/cc
        run: ./scripts/run-linux-rpm-checks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ok-player-fedora-${{ matrix.fedora }}
          path: artifacts/linux/rpm/fedora-${{ matrix.fedora }}/**

  # Deliberately a separate job in a separate container. The build root cannot
  # host this check: mesa-libEGL-devel and mesa-libGL-devel pull libglvnd-devel,
  # which pulls libglvnd-gles, so libGLESv2.so.2 - the library GTK4 dlopens
  # through libepoxy and the one whose absence aborts startup - is present in
  # the build root no matter what the package declares. Installing and launching
  # there proves nothing about the RPM's dependency closure. This job installs
  # the package into a root carrying only the headless harness, so anything the
  # application needs at runtime has to arrive through the package's own
  # Requires. The gate refuses to run if that root is contaminated.
  rpm-launch:
    name: Fedora ${{ matrix.fedora }} installed-RPM launch
    needs: rpm
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      # install_weak_deps=False on every install into this root, not only on
      # the harness step below: anything dnf pulls in here for its own
      # convenience is still a library the package did not have to declare.
      - name: Disable nonessential repositories before checkout
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf-plugins-core
          dnf config-manager setopt fedora-cisco-openh264.enabled=0
          dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v4

      # Harness only: a disposable X server, a window manager, input synthesis,
      # window inspection, screen capture, and a session bus. Nothing here may
      # be a runtime dependency of the application - if a package added to this
      # list starts providing a library the RPM is supposed to pull in, the gate
      # fails with an explicit contamination error instead of passing silently.
      # install_weak_deps=False is load-bearing, not tidiness: on Fedora 44
      # ffmpeg-free recommends libcamera, which requires libGLESv2.so.2 and so
      # drags libglvnd-gles into the launch root. The contamination guard caught
      # exactly that and failed the job. Weak dependencies are what a harness
      # does not need and what quietly re-blinds this gate. The gate installs
      # the package itself with the same flag, for the mirror-image reason: a
      # `Recommends` must not be able to satisfy the post-install assertion.
      # rust/crates/okp-linux-gtk/src/tests.rs pins both, in a required check.
      - name: Install the headless launch harness
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            xorg-x11-server-Xvfb xorg-x11-xauth util-linux \
            xwininfo xprop xdotool xfwm4 \
            ImageMagick ripgrep ffmpeg-free python3 \
            dbus-daemon glib2

      - uses: actions/download-artifact@v4
        with:
          name: ok-player-fedora-${{ matrix.fedora }}
          path: artifacts/linux/rpm/fedora-${{ matrix.fedora }}

      - name: Install and launch the packaged application
        run: |
          ./scripts/smoke-linux-rpm-installed-launch.sh \
            "artifacts/linux/rpm/fedora-${{ matrix.fedora }}/current" \
            "artifacts/linux/rpm/installed-launch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ok-player-fedora-${{ matrix.fedora }}-installed-launch
          path: artifacts/linux/rpm/installed-launch/**
          if-no-files-found: warn

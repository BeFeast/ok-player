name: Update Feeds

# The static home of the OK Player update channels (issues #131 Windows, #162 Linux) and of
# the signed APT repository (issue #683).
# Installed builds read their channel manifest from https://befeast.github.io/ok-player/:
#   - Windows (Velopack SimpleWebSource):   updates/win/releases.win.json
#   - Linux AppImage (Velopack HttpSource): updates/linux/releases.linux.json
#   - Linux .deb self-updater:              updates/linux/deb.linux.json
#   - Debian/Ubuntu system updater:         apt/ (dists + pool, signed; scripts/build-apt-repo.sh)
# This workflow is the ONLY writer of that site. It rebuilds the whole site from docs/site plus
# manifests derived from the newest published release on each track (scripts/build-win-feed.sh and
# scripts/build-linux-feed.sh) and deploys to GitHub Pages atomically — deploy-pages swaps the
# entire site in one step, so every feed is always present and there is no window where any is
# missing or half-written. Because the deploy replaces the whole site, BOTH feeds are rebuilt on
# every run; one workflow owning the whole site is what keeps a Linux-triggered redeploy from
# clobbering the Windows feed and vice versa.
#
# Triggers:
#   - release published: `vpk upload github` (installer/build-velopack.ps1 -Publish) publishes the
#     Windows v* release with the operator's token, so this event fires and the feed update rides
#     the Windows release pipeline. Linux releases are created by release-linux.yml with
#     GITHUB_TOKEN, which never fires this event — release-linux.yml instead calls this workflow
#     directly via workflow_call once it has published a linux-v* release.
#   - push to main touching the site or a generator: content redeploy.
#   - workflow_dispatch: manual redeploy, first-time bootstrap, belt-and-braces re-runs.
#   - workflow_call: invoked by release-linux.yml after publishing a linux-v* release.
# Every run rebuilds both feeds AND the APT archive from the current source of truth, so
# overlapping or repeated triggers are harmless; the concurrency group serializes deploys so the
# last one wins. The APT archive is regenerated the same way for the same reason: it is derived
# from the published linux-v* releases, so a rebuild reproduces it rather than mutating it, and
# a version already published keeps its exact pool bytes and checksums.
#
# The APT lane needs the archive signing key, which lives in Infisical and is fetched at run
# time (issue #683) — it is deliberately not a GitHub Actions secret. Only the two Universal
# Auth client credentials are, and without them this workflow fails instead of deploying an
# unsigned archive. That means an outage of the secret store blocks the whole Pages deploy,
# including the JSON feeds, which is the intended trade: apt clients that have already trusted
# this archive must never be served something unsigned or signed by an unexpected key.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/build-win-feed.sh'
      - 'scripts/build-linux-feed.sh'
      - 'scripts/build-apt-repo.sh'
      - 'scripts/verify-apt-repo.sh'
      - '.github/workflows/publish-update-feeds.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The signing key lives in Infisical on the internal network, which GitHub-hosted
  # runners cannot resolve. Only this job needs it, so only this job runs on the
  # self-hosted builder; the signed archive travels to the deploy job as an artifact
  # and no key material ever leaves the internal host.
  apt-repository:
    name: Build the signed APT repository
    runs-on: [self-hosted, mimir]
    steps:
      - uses: actions/checkout@v4

      - name: Build signed APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: ./scripts/build-apt-repo.sh "${{ github.repository }}" _site

      # apt itself is the only authority on whether this archive works. A missing container
      # runtime fails the lane rather than skipping the check.

      - uses: actions/upload-artifact@v4
        with:
          name: apt-repository
          path: _site
          retention-days: 1
          if-no-files-found: error

  publish-feeds:
    name: Publish update feeds to GitHub Pages
    needs: apt-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Both scripts stage the shared docs/site skeleton idempotently, then write their own
      # updates/<track>/ subtree. Running both into one _site yields the complete site so the
      # single deploy below never drops the other track's feed.
      - name: Build site + Windows manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-win-feed.sh "${{ github.repository }}" _site

      - name: Build Linux manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-linux-feed.sh "${{ github.repository }}" _site

      # dpkg-dev carries dpkg-scanpackages, which indexes the pool. Installed explicitly rather
      # than assumed from the runner image, so a base-image change fails here with a clear
      # message instead of half way through building the archive.
      - name: Install APT archive tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg

      # Fetches the signing key from Infisical into an ephemeral GNUPGHOME, verifies its
      # fingerprint against the expected one, signs, and publishes only the public key.
      - name: Verify the APT repository installs from a clean Debian root
        run: ./scripts/verify-apt-repo.sh _site/apt

      # enablement: true creates the Pages site (build type "workflow") on the first run, so no
      # separate admin step is needed. If org policy blocks API enablement, enable it once by
      # hand: Settings -> Pages -> Source: GitHub Actions.
      # The APT archive was produced on the internal builder because that is where
      # the signing key is reachable; merge it in before the single deploy so the
      # site carries both the JSON feeds and the signed repository.
      - uses: actions/download-artifact@v4
        with:
          name: apt-repository
          path: _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

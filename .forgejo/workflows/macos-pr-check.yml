name: macOS PR check

# The Mac build of every Forgejo pull request and of main. Forgejo has no Mac runner in
# the pull request gate; the build runs on a GitHub-hosted Apple Silicon runner through
# .github/workflows/macos-player-preview.yml. scripts/mac-ci-bridge.py pushes the commit
# to a bridge branch on the GitHub mirror - mac-ci/pr-<number> for a pull request,
# mac-ci/<branch> for a push or a manual run - without opening a GitHub pull request,
# waits for the macOS run that push starts, fails unless that run passed, and deletes
# the branch. The run's artifact - ok-player-macos-arm64.zip, SHA256SUMS.txt and the
# light/dark window snapshots - is published again as the artifact
# macos-player-<commit SHA> of this run, so a build can be downloaded without a GitHub
# account.
#
# The pull request job always runs and gets the same check name, so it can be required:
# a pull request that touches nothing the Mac build reads passes at once without a
# build. A push to main uses the same path set, compared with the previous tip, so a
# main commit that changes the Mac build has a downloadable build of its own. A manual
# run builds the tip of the chosen branch without the path check, for example the main
# tip when its newest commit changed nothing the Mac build reads.
#
# Credentials: the MAC_CI_GITHUB_TOKEN repository secret, a GitHub token that can push
# to the mirror, including workflow files, and read and cancel its Actions runs. Until
# it is configured the job builds nothing and passes with a warning in its log, so the
# check gates nothing yet; once it exists every failed, cancelled or timed-out Mac run
# is red. macos/README.md has the one-time setup.
#
# The manual "macOS player preview" workflow on the self-hosted Mac stays an on-demand
# fallback and is not part of this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its superseded run. Runs on main queue instead,
# as in the Rust workflow, so every main commit that needs a build gets one.
concurrency:
  group: macos-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bridge:
    name: Apple Silicon app (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Empty for a manual run, which builds without the path check.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # Full history: the scope check diffs against the merge base, and pushing the
      # commit to the mirror needs every commit the mirror does not have yet.
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Does the change touch the macOS build?
        id: scope
        run: python3 scripts/mac-ci-bridge.py scope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: No macOS-relevant change
        if: steps.scope.outputs.relevant != 'true'
        run: echo "No macOS-relevant change; passing without a Mac build."

      - name: Build, test and smoke on a GitHub-hosted Mac
        if: steps.scope.outputs.relevant == 'true'
        env:
          MAC_CI_GITHUB_TOKEN: ${{ secrets.MAC_CI_GITHUB_TOKEN }}
        run: |
          ref="mac-ci/$BRANCH"
          if [ "$EVENT_NAME" = pull_request ]; then ref="mac-ci/pr-$PR_NUMBER"; fi
          python3 scripts/mac-ci-bridge.py run --sha "$HEAD_SHA" --ref "$ref" \
            --download-dir mac-ci-artifact --without-token skip

      - name: Publish the Mac build
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: macos-player-${{ github.event.pull_request.head.sha || github.sha }}
          path: mac-ci-artifact/
          if-no-files-found: ignore
          retention-days: 30

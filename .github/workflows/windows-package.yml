name: Windows Installer

# The shipping Windows artifact is the Velopack Setup.exe produced by
# installer/build-velopack.ps1. Until this workflow existed, nothing in CI ran
# that script: the release lane was a manual local operation, and
# release-windows-candidate.yml only packs the separate `win-candidate` channel
# after a merge. This lane builds the real `win` installer, installs it, asserts
# the installed tree is complete, and starts the installed application.
#
# This workflow is NOT in main's required status checks (those are "Unit tests
# (engine-agnostic Core, headless)", "Rust workspace (Linux)" and "Integration
# tests (real libmpv + render-thread guard)"). It reports on pull requests but
# cannot block a merge on its own; making it blocking is a branch-protection
# change only an operator can make. The regression tests for the assertion this
# lane runs live in scripts/tests/windows-installed-tree.Tests.ps1.
#
# Path-gated on purpose, on pull requests AND on pushes to main: a full
# self-contained WinUI publish plus a Velopack pack is expensive, and the lane
# has a known intermittent shutdown failure (#642). An advisory lane that goes
# red on unrelated pushes trains everyone to ignore it, so it only runs for
# changes that can plausibly break the installer. The two path lists below are
# duplicated rather than shared because GitHub Actions does not support YAML
# anchors; keep them identical.

on:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'installer/**'
      # All of src/**, not just App and Core: OkPlayer.App references
      # OkPlayer.DesignSystem and OkPlayer.Render, and Render references
      # OkPlayer.Mpv, so every project under src/ ends up inside the installer.
      # A DesignSystem resource change that compiles but breaks the packaged
      # main window would otherwise skip this lane entirely.
      - 'src/**'
      - 'OkPlayer.sln'
      # Central build and package version pinning (WindowsAppSDK, Velopack):
      # a change here changes what the installer contains.
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/fetch-natives.ps1'
      - 'scripts/assert-windows-installed-tree.ps1'
      # build-velopack.ps1 copies both of these into the publish tree
      # unconditionally, so renaming or deleting either breaks the pack.
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/windows-package.yml'
      - 'installer/**'
      - 'src/**'
      - 'OkPlayer.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/fetch-natives.ps1'
      - 'scripts/assert-windows-installed-tree.ps1'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
  workflow_dispatch:

jobs:
  windows-installer:
    name: Build, install, and launch the Velopack installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-natives.ps1

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # A CI-only version keeps this lane from ever colliding with a real tag.
      - name: Build the Velopack installer
        shell: pwsh
        run: ./installer/build-velopack.ps1 -Version "0.0.1-ci.${{ github.run_number }}"

      - name: Assert the shipping installer artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = Join-Path $PWD 'artifacts\releases'
          foreach ($name in @('OkPlayer-win-Setup.exe', 'releases.win.json')) {
            $path = Join-Path $releases $name
            if (-not (Test-Path $path)) { throw "Velopack pack did not produce $name" }
            Write-Host "$name : $((Get-Item $path).Length) bytes"
          }

      - name: Install the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'artifacts\releases\OkPlayer-win-Setup.exe'
          $proc = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Setup.exe exited with $($proc.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'OkPlayer\current\OkPlayer.exe'
          if (-not (Test-Path $installed)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'OkPlayer') -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "Installed executable not found at $installed"
          }
          Write-Host "Installed: $installed"

      # A window on screen does not prove the app shipped complete: libmpv-2.dll
      # and ffmpeg.exe are both bundled through Condition="Exists(...)" Content
      # items, and the ffmpeg fetch is best-effort, so an installer with no
      # engine and no ffmpeg installs and starts just fine.
      - name: Assert the installed tree is complete
        shell: pwsh
        run: |
          ./scripts/assert-windows-installed-tree.ps1 `
            -InstallRoot (Join-Path $env:LOCALAPPDATA 'OkPlayer\current')

      # A size floor separates "present" from "empty or obviously truncated"; it
      # cannot separate a complete ffmpeg from a partial one that is still over
      # 1 MB. fetch-natives.ps1 does not check 7-Zip's exit code and keeps
      # whatever it extracted, and nothing else in this lane ever runs ffmpeg -
      # the app only reaches it for subtitle auto-sync, which the idle-window
      # launch below does not exercise. So run it and require it to identify
      # itself. libmpv-2.dll needs no equivalent step: the launch below fails
      # without a working engine.
      - name: Assert the bundled ffmpeg runs
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $env:LOCALAPPDATA 'OkPlayer\current\ffmpeg.exe'
          $ErrorActionPreference = 'Continue'
          $output = (& $ffmpeg -hide_banner -version 2>&1 |
            ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) {
            throw "ffmpeg.exe -version exited with ${code}: $output"
          }
          if ($output -notmatch 'ffmpeg version') {
            throw "ffmpeg.exe ran but did not identify itself: $output"
          }
          Write-Host $output.Split([Environment]::NewLine)[0]

      # The redirected stdout/stderr below are structurally always empty: this is
      # a WinUI GUI app (WindowsPackageType=None, WindowsAppSDKSelfContained in
      # Release) and it writes to neither stream. So the streams cannot name the
      # exception behind the intermittent 0xC000027B on exit (#642), and every
      # failing run so far has dumped two empty files.
      #
      # There are exactly two things that can name it. The app's own per-launch
      # log (src/OkPlayer.App/Services/Log.cs) already records lifecycle
      # breadcrumbs, mpv's warnings, and every unhandled exception from all three
      # managed surfaces - collected after the launch step below. And a WER crash
      # dump, which is the only source that survives a fault the managed handlers
      # never see, such as a stowed exception raised by the XAML framework itself.
      # LocalDumps has to be armed before the process starts, hence this step's
      # position. Runner-local registry state; nothing here gates the lane.
      - name: Arm crash-dump collection for the installed app
        # Diagnostics must never decide this lane's verdict. Writing under HKLM
        # needs the runner's administrator context; if a future runner image
        # withdraws it, the launch gate below still has to run and report - a red
        # job with no launch result would hide the defect instead of exposing it.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumps = Join-Path $env:RUNNER_TEMP 'okplayer-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\OkPlayer.exe'
          New-Item -Path $key -Force | Out-Null
          # DumpType 2 = full dump: a mini dump drops the heap, and the stowed
          # exception record lives in heap memory reached from the error context.
          New-ItemProperty -Path $key -Name 'DumpFolder' -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name 'DumpType' -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name 'DumpCount' -Value 5 -PropertyType DWord -Force | Out-Null
          Write-Host "WER local dumps for OkPlayer.exe -> $dumps"

      # The point of this lane: start the executable the installer actually put
      # on the machine and require a real top-level window that is the player's
      # own window, then require it to shut down on request. No leg here may pass
      # by being skipped - every branch either asserts or throws.
      - name: Launch the installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedTitle = 'OK Player'
          $installed = Join-Path $env:LOCALAPPDATA 'OkPlayer\current\OkPlayer.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'okplayer-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'okplayer-stderr.log'
          $proc = Start-Process -FilePath $installed -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(90)
          $handle = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
              if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
              throw "The installed application exited with $($proc.ExitCode) before showing a window"
            }
            $proc.Refresh()
            if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
              $handle = $proc.MainWindowHandle
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if ($handle -eq [IntPtr]::Zero) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw 'The installed application never created a top-level window'
          }
          Write-Host "Main window handle: $handle - title: $($proc.MainWindowTitle)"
          # A window handle can appear before WinUI has finished starting up,
          # so closing on the handle alone risks testing shutdown-during-startup
          # rather than shutdown of a running app - and this lane has an
          # intermittent 0xC000027B on exit. WaitForInputIdle is a readiness
          # condition, not a settle delay: it returns when the process has
          # drained its startup work and is waiting for input, and a timeout is
          # a real failure rather than something to sleep through.
          #
          # Measured, run 30237873377: it returned ~4ms after the window handle
          # appeared and the 0xC000027B still followed. So the app is already
          # input-idle when its window shows, the crash is NOT a startup race,
          # and this step neither shortens what the clean-exit check covers nor
          # makes the lane green. What it does is assert a real property and rule
          # out the leading hypothesis in #642.
          if (-not $proc.WaitForInputIdle(60000)) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw 'The installed application showed a window but never became ready for input'
          }
          Write-Host 'The installed application is idle and ready for input'
          # An error dialog, a crash reporter, or a fallback shell also produces
          # a top-level window. Require the player's own window identity.
          if ($proc.MainWindowTitle -ne $expectedTitle) {
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            $proc.Kill()
            throw "Expected the main window title '$expectedTitle', got '$($proc.MainWindowTitle)'"
          }
          if (-not $proc.CloseMainWindow()) { throw 'The installed application refused a close request' }
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw 'The installed application did not exit within 30s of a close request'
          }
          Write-Host "Exit code after close: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            # A -1073741189 (0xC000027B, STATUS_STOWED_EXCEPTION) here is the
            # known open shutdown defect tracked in #642; this step deliberately
            # still fails on it rather than tolerating it. The two streams below
            # are printed for completeness only - a WinUI app writes to neither,
            # and what actually names the exception is the diagnostics step that
            # follows, which runs on this failure path too.
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            throw "The installed application exited with $($proc.ExitCode)"
          }

      # Runs on the failure path as well - that is the point. The app's own log
      # is written per line and flushed, so it survives both a crash and a hard
      # hang, and it is printed into the run log rather than only uploaded: an
      # intermittent defect is diagnosed by comparing a failing run against a
      # passing one, and neither is worth a manual artifact download. On a clean
      # run this is the baseline; on a 0xC000027B run the final STEP breadcrumb
      # separates a managed exception (logged with its stack) from a fault inside
      # XAML shutdown from one after "Application.Start returned", and any dump
      # listed here carries the stowed-exception record for the last case.
      - name: Collect the installed app's own diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $collected = Join-Path $env:RUNNER_TEMP 'okplayer-applogs'
          New-Item -ItemType Directory -Force -Path $collected | Out-Null
          $logDir = Join-Path $env:LOCALAPPDATA 'OkPlayer\logs'
          $logs = @(Get-ChildItem -Path (Join-Path $logDir 'okplayer-*.log') -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            Write-Host "No application log under $logDir - the app never reached Log.Init."
          } else {
            foreach ($log in $logs) {
              Copy-Item -Path $log.FullName -Destination $collected -Force
              Write-Host "---- $($log.Name) ($($log.Length) bytes) ----"
              Get-Content -Path $log.FullName | Write-Host
            }
          }
          $dumps = @(Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'okplayer-dumps\*.dmp') -ErrorAction SilentlyContinue)
          if ($dumps.Count -eq 0) {
            Write-Host 'No WER crash dump was written (the process did not fault, or WER declined).'
          } else {
            foreach ($dump in $dumps) { Write-Host "crash dump: $($dump.Name) ($($dump.Length) bytes)" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ok-player-windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/releases/**
            ${{ runner.temp }}/okplayer-*.log
            ${{ runner.temp }}/okplayer-applogs/**
            ${{ runner.temp }}/okplayer-dumps/**
          if-no-files-found: warn
